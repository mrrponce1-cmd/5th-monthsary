<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You ♥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0010;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Georgia', serif;
      user-select: none;
    }

    h1 {
      color: #ff6680;
      font-size: 2rem;
      letter-spacing: 6px;
      text-shadow:
        0 0 10px #ff4466,
        0 0 30px #ff2244,
        0 0 60px #ff0033;
      margin-bottom: 10px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.75; }
    }

    canvas {
      cursor: grab;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(255, 60, 100, 0.3);
    }

    canvas:active { cursor: grabbing; }

    #hint {
      margin-top: 10px;
      color: #ff9aaa88;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    #upload-wrapper {
      position: fixed;
      bottom: 18px;
      right: 22px;
    }

    #upload-btn {
      background: rgba(255, 60, 100, 0.15);
      border: 1px solid #ff6680;
      color: #ff9aaa;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    #upload-btn:hover { background: rgba(255, 60, 100, 0.35); }
    #file-input { display: none; }
  </style>
</head>
<body>

  <h1>I Love You ♥</h1>
  <canvas id="c"></canvas>
  <p id="hint">🖱 Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; R to reset</p>

  <div id="upload-wrapper">
    <button id="upload-btn" onclick="document.getElementById('file-input').click()">
      📷 Change Photo
    </button>
    <input type="file" id="file-input" accept="image/*" />
  </div>

<script>
// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const W = canvas.width  = Math.min(window.innerWidth  - 40, 960);
const H = canvas.height = Math.min(window.innerHeight - 120, 620);

// ── Config ───────────────────────────────────────────────────────────────────
const TEXT       = 'ILOVEYOU♥ ';
const COLS       = 55;
const FONT_SIZE  = 11;
const MAX_DEPTH  = 130;
const MIN_BRIGHT = 0.07;
const DEFAULT_IMAGE = 'ff89903a-e786-4312-b75d-5f8d7baec975.jpg';

// Side panel text — shown on LEFT and RIGHT edges, like a book spine
// Each string is one row of characters running top-to-bottom
const LEFT_TEXT  = '♥ I LOVE YOU ♥ HAPPY 5TH MONTHSARY ♥';
const RIGHT_TEXT = '♥ YOU ARE MY WORLD ♥ FOREVER YOURS ♥ ';

// ── State ────────────────────────────────────────────────────────────────────
let points      = [];   // front photo  {x,y,z,r,g,b,ch,side:'front'}
let sidePoints  = [];   // side panels  {x,y,z,r,g,b,ch,side:'left'|'right'}
let photoHalfW  = 1;    // set after image loads — half-width of photo in world units
let photoHalfH  = 1;
let rotX        =  0.25;
let rotY        = -0.60;
let zoom        =  1.0;
let dragging    = false;
let lastMX      = 0, lastMY = 0;

// ── Build side panels ─────────────────────────────────────────────────────────
// Each panel is a vertical wall of text perpendicular to the photo face.
// It lives at x = ±photoHalfW, with z running from 0 → MAX_DEPTH (same depth
// range as the photo), so it only peeks out when you rotate left or right.
function buildSidePanels() {
  sidePoints = [];
  const charH   = FONT_SIZE * 1.8;   // vertical spacing between characters
  const panelD  = MAX_DEPTH;         // depth of the panel (matches photo)

  function makePanel(text, sideX, side) {
    const chars  = [...text];
    const totalH = chars.length * charH;
    const startY = totalH / 2;

    chars.forEach((ch, i) => {
      const t = i / Math.max(1, chars.length - 1);  // 0..1 for colour gradient
      const r = Math.round(255);
      const g = Math.round(80  + t * 120);   // 80 → 200
      const b = Math.round(130 + t * 90);    // 130 → 220

      // The panel is perpendicular: X is fixed (edge of photo),
      // Z varies top→bottom so the letters stack along the depth axis
      sidePoints.push({
        x:    sideX,
        y:    startY - i * charH,
        z:    panelD * 0.5,              // centred in depth
        r, g, b,
        ch,
        side,
      });
    });
  }

  makePanel(LEFT_TEXT,  -photoHalfW - FONT_SIZE, 'left');
  makePanel(RIGHT_TEXT,  photoHalfW + FONT_SIZE, 'right');
}

// ── Visibility helpers ───────────────────────────────────────────────────────
// Returns how "visible" a side panel is from current camera angle.
// Left panel: visible when rotY < 0 (camera sees the left edge)
// Right panel: visible when rotY > 0
function sideOpacity(side) {
  // rotY = 0 → straight on (hidden), rotY = ±π/2 → edge-on (fully visible)
  const angle = ((rotY % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  if (side === 'left') {
    // visible when rotY is negative (or > π) — looking from the left
    const a = Math.sin(-rotY);
    return Math.max(0, a);
  } else {
    const a = Math.sin(rotY);
    return Math.max(0, a);
  }
}

// ── Build point cloud from image ─────────────────────────────────────────────
function buildPoints(imgEl) {
  const cols = COLS;
  const rows = Math.max(1, Math.round(cols * imgEl.naturalHeight / imgEl.naturalWidth));

  const off  = document.createElement('canvas');
  off.width  = cols;
  off.height = rows;
  const octx = off.getContext('2d');
  octx.drawImage(imgEl, 0, 0, cols, rows);
  const data = octx.getImageData(0, 0, cols, rows).data;

  const cx = cols / 2;
  const cy = rows / 2;
  const chars = [...TEXT];
  let ci = 0;
  points = [];

  // Store half-dimensions in world units for side panel placement
  photoHalfW = cx * FONT_SIZE;
  photoHalfH = cy * FONT_SIZE;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = (r * cols + c) * 4;
      const red   = data[idx]     / 255;
      const green = data[idx + 1] / 255;
      const blue  = data[idx + 2] / 255;
      const bri   = (red + green + blue) / 3;

      if (bri < MIN_BRIGHT) { ci = (ci + 1) % chars.length; continue; }

      points.push({
        x:    (c - cx) * FONT_SIZE,
        y:    (cy - r) * FONT_SIZE,
        z:    bri * MAX_DEPTH,
        r:    data[idx],
        g:    data[idx + 1],
        b:    data[idx + 2],
        ch:   chars[ci],
        side: 'front',
      });
      ci = (ci + 1) % chars.length;
    }
  }

  buildSidePanels();
}

// ── 3-D projection ───────────────────────────────────────────────────────────
function project(x, y, z) {
  // Rotate Y
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x2 =  cosY * x + sinY * z;
  const z2 = -sinY * x + cosY * z;

  // Rotate X
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const y2 =  cosX * y - sinX * z2;
  const z3 =  sinX * y + cosX * z2;

  // Perspective
  const fov   = 500 * zoom;
  const scale = fov / (fov + z3 + 250);
  return {
    sx: W / 2 + x2 * scale,
    sy: H / 2 - y2 * scale,
    scale,
    depth: z3,
  };
}

// ── Render loop ───────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Combine front photo + side panels
  const all = [...points, ...sidePoints];

  // Project all points
  const projected = all.map(p => {
    const { sx, sy, scale, depth } = project(p.x, p.y, p.z);
    return { sx, sy, scale, depth, r: p.r, g: p.g, b: p.b, ch: p.ch, side: p.side };
  });

  // Painter's algorithm — back to front
  projected.sort((a, b) => a.depth - b.depth);

  for (const p of projected) {
    const isSide = p.side === 'left' || p.side === 'right';

    // Side panels fade in only when their edge is turned toward the camera
    let alpha = 1.0;
    if (isSide) {
      alpha = sideOpacity(p.side);
      if (alpha < 0.02) continue;   // fully hidden — skip drawing
    }

    const fs = Math.max(5, Math.round(FONT_SIZE * p.scale * zoom));
    ctx.font = `bold ${fs}px Consolas, monospace`;

    if (isSide) {
      ctx.globalAlpha = alpha;
      ctx.shadowColor = `rgb(${p.r},${p.g},${p.b})`;
      ctx.shadowBlur  = 6 * alpha;
    } else {
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur  = 0;
    }

    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillText(p.ch, p.sx, p.sy);
  }

  ctx.globalAlpha = 1.0;
  ctx.shadowBlur  = 0;
  requestAnimationFrame(render);
}

// ── Load image helper ─────────────────────────────────────────────────────────
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function init(src) {
  const img = await loadImage(src);
  if (!img) {
    // Draw placeholder message
    ctx.fillStyle = '#ff6680';
    ctx.font = 'bold 18px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('Could not load photo. Click "Change Photo" →', W/2, H/2);
    return;
  }
  buildPoints(img);
}

// ── Mouse controls ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
});
window.addEventListener('mouseup',   () => { dragging = false; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastMX) * 0.005;
  rotX += (e.clientY - lastMY) * 0.005;
  lastMX = e.clientX;
  lastMY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3.5, zoom - e.deltaY * 0.001));
}, { passive: false });

// Touch support
let lastTouchX = 0, lastTouchY = 0, lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY,
    );
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    rotY += (e.touches[0].clientX - lastTouchX) * 0.005;
    rotX += (e.touches[0].clientY - lastTouchY) * 0.005;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY,
    );
    zoom = Math.max(0.3, Math.min(3.5, zoom * (dist / lastTouchDist)));
    lastTouchDist = dist;
  }
}, { passive: false });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r') {
    rotX = 0.25; rotY = -0.60; zoom = 1.0;
  }
});

// File upload
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  init(url);
});

// ── Kick off ──────────────────────────────────────────────────────────────────
init(DEFAULT_IMAGE);
render();
</script>
</body>
</html>
